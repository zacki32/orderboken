<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a3162b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orderboken">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Orderboken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Standalone Orderboken: no claude.ai needed. Data lives on this phone (localStorage).
   Optional: your own Claude API key for smarter reading + "ask" tab. */
:root{color-scheme:light dark;
--bg:light-dark(#fbf8f4,#171112);--paper:light-dark(#ffffff,#221a1b);--ink:light-dark(#1d1414,#f3ecea);
--mute:light-dark(#6f6262,#b4a6a4);--red:light-dark(#a3162b,#e2465c);--redbg:light-dark(#f8e4e6,#3a1e22);
--line:light-dark(#eadfda,#3a2f30);--ok:light-dark(#2f6b3a,#7fcf8c)}
*{box-sizing:border-box;min-width:0}
textarea,input,select{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Noto Sans Arabic",system-ui,sans-serif;overflow-x:clip}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] textarea{font-family:"Noto Sans Arabic",Inter,system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:calc(12px + env(safe-area-inset-top)) max(5vw,16px) 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1240px;margin:auto}
.hbtns{display:flex;gap:8px;flex:none}
h1{font:800 clamp(24px,5vw,34px)/1.05 Archivo,"Noto Sans Arabic",sans-serif;margin:0}
.sub{opacity:.85;font-size:14px;margin:4px 0 0}
.lang option{color:#1d1414;background:#fff}
select.lang{appearance:none;-webkit-appearance:none;padding:0 14px;text-align:center}
.lang{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;min-height:44px;padding:0 16px;font:600 15px Inter,"Noto Sans Arabic";cursor:pointer}
main{max-width:1240px;margin:auto;padding:0 max(5vw,16px) calc(100px + env(safe-area-inset-bottom))}
.feed{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:-12px;box-shadow:0 8px 24px rgba(60,10,20,.08)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 45%,transparent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 16px;font:600 15px Inter,"Noto Sans Arabic",sans-serif;cursor:pointer}
.pri{background:var(--red);border-color:var(--red);color:#fff;flex:1 1 160px}
.big{display:block;width:100%;min-height:96px;font:800 24px Archivo,"Noto Sans Arabic",sans-serif;border-radius:16px;margin-bottom:10px;background:var(--red);border-color:var(--red);color:#fff}
.big.on{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.hint{color:var(--mute);font-size:13px;margin:8px 2px 0}
.status{font-size:14px;color:var(--red);min-height:20px;margin:6px 2px 0}
.draft{border:2px dashed var(--red);border-radius:14px;padding:12px;margin-top:12px;background:var(--redbg)}
.draft h3{margin:0 0 6px;font:700 16px Archivo,"Noto Sans Arabic"}
.draft .dord{background:var(--paper);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.fld{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:40px;padding:0 8px;font-size:16px}
.nm{width:100%;font-weight:700}
.irow{display:grid;grid-template-columns:1fr 76px 84px 40px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.irow:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;margin:22px 0 14px;overflow-x:auto}
.tabs button{flex:none;border-radius:999px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--paper);color:var(--ink);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.slip{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;padding:14px 14px 10px}
.slip header{all:unset;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.slip h2{font:800 20px/1.15 Archivo,"Noto Sans Arabic",sans-serif;margin:0 0 2px}
.meta{color:var(--mute);font-size:13px}
ul{list-style:none;margin:10px 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.q{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ar{color:var(--mute);font-size:13px}
.order{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.order.done{opacity:.55}
.order .raw{font-size:13px;color:var(--mute);font-style:italic}
.small{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.del{color:var(--red)}
.tot li{font-size:17px}
.tot .q{color:var(--red)}
.empty{color:var(--mute);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.answer{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;margin-top:12px}
.flag{background:#fff3cd;color:#5a4300;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
.settings{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.settings h3{margin:14px 0 4px;font:700 16px Archivo,"Noto Sans Arabic"}
.settings h3:first-child{margin-top:0}
.settings input[type=password]{width:100%}
.ok{color:var(--ok);font-weight:600}
.calc{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.calc summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.calc textarea{min-height:76px;margin-bottom:8px}
.calc .cl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.calc .ctot{display:flex;justify-content:space-between;gap:10px;padding:10px 0 12px;font:800 20px Archivo,"Noto Sans Arabic",sans-serif;color:var(--red)}
.csum{color:var(--ink);white-space:nowrap}
.crow{flex-wrap:wrap}
.dimg{display:block;max-width:100%;max-height:220px;margin:4px 0 10px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:#fff;cursor:zoom-in}
.dimg.big{max-height:none;cursor:zoom-out}
.crow{display:flex;gap:6px;align-items:center;padding:0 0 6px;font-size:13px;color:var(--mute)}
.crow .fld{width:76px;min-height:36px}
.srow .have{text-align:end}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mode button{border-radius:12px}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed.in{border-top:5px solid var(--ok)}
.feed.in .big,.feed.in .pri{background:var(--ok);border-color:var(--ok)}
.draft.in{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.slip.inl{border-top-color:var(--ok)}
.srow{padding:10px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .top1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.srow .have{font:800 22px/1.1 Archivo,"Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .nums{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:4px;font-size:13px;color:var(--mute)}
.srow .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.neg,.srow .nums b.neg{color:var(--red)}
.short{background:var(--redbg);color:var(--red);border-radius:999px;padding:1px 8px;font-weight:700;font-size:12px}
.acts{display:flex;gap:10px}
.acts .big{flex:1 1 0;min-height:84px;font-size:20px;margin-bottom:10px}
.acts .big[hidden]{display:none}
#view{margin-top:18px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:13px;color:var(--mute);border-radius:14px;padding:0 4px}
.bottom .ico{font-size:24px;line-height:1}
.bottom button[aria-selected=true]{color:var(--ink);background:var(--redbg)}
.donebtn{width:100%;margin-top:14px;color:var(--mute)}
.settings select.fld{width:100%;min-height:44px}
.settings a{color:var(--red)}
.who{width:100%;min-height:52px;font-size:18px;font-weight:700}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cat{min-height:78px;border-radius:16px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 19px Archivo,"Noto Sans Arabic",sans-serif;padding:4px}
.cat .ce{font-size:28px;line-height:1}
.cat .cn{font:700 12px Inter,"Noto Sans Arabic",sans-serif;color:var(--ok);min-height:16px}
.cart{margin-top:12px}
.carth{font:700 14px Archivo,"Noto Sans Arabic";color:var(--mute);margin:0 0 4px}
.cline{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cline{flex-wrap:wrap}
.cline .cp{flex:1 1 150px;font-weight:600}
.ctl{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.cline .qn{min-width:58px;text-align:center;font:800 17px Archivo,"Noto Sans Arabic";font-variant-numeric:tabular-nums}
.qb{min-width:44px;padding:0;font-size:20px}
.savebig{width:100%;min-height:56px;margin-top:12px;font-size:17px}
.savebig:disabled{opacity:.45}
.alt button{flex:1 1 0;color:var(--mute)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetbox{background:var(--paper);color:var(--ink);width:100%;max-width:640px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheethead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheethead h2{margin:0;flex:1;font:800 22px Archivo,"Noto Sans Arabic",sans-serif}
.sheetmsg{color:var(--ok);font-weight:700;font-size:14px}
.sheethead button{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sheetBody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;font-size:18px;font-weight:600;text-align:start;padding:0 4px}
.prow .badge{background:var(--redbg);color:var(--red);border-radius:999px;padding:2px 10px;font-size:14px;white-space:nowrap}
.erow{cursor:default}
.eact{display:flex;gap:6px;flex:none}
.prow.newp{color:var(--mute);font-weight:600;border-bottom:0}
.qtybox{text-align:center;padding:8px 0 4px}
.qtybox .pname{font:800 24px/1.2 Archivo,"Noto Sans Arabic",sans-serif;margin:8px 0 4px}
.qrow{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}
.qrow .qb{min-width:64px;min-height:64px;font-size:30px;border-radius:16px}
.qin{width:130px;text-align:center;font:800 38px Archivo,"Noto Sans Arabic",sans-serif;min-height:64px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.quick button{min-width:58px}
.qtybox .pri{width:100%;min-height:58px;font-size:18px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:800 17px Archivo,"Noto Sans Arabic",sans-serif;margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.ghead:first-child{margin-top:0}
.ghead .meta{font:600 13px Inter,"Noto Sans Arabic"}
.pc summary{font-size:13px;color:var(--mute);cursor:pointer;min-height:30px;display:flex;align-items:center}
.pc div{display:flex;justify-content:space-between;font-size:14px;padding:2px 0 2px 10px}
.plist{margin:6px 0 10px}
.pline{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}
.pline span{flex:1}
.pline select{min-height:36px;font-size:13px;width:auto}
/* easy to read: larger text and touch targets */
body{font-size:19px;line-height:1.45}
h1{font-size:clamp(24px,5vw,32px)}
button{font-size:18px;min-height:50px}
.small{font-size:16px;min-height:44px;padding:0 12px}
.meta,.hint,.ar{font-size:15px}
.status{font-size:17px;font-weight:600}
.fld,textarea{font-size:18px}
.fld{min-height:48px}
.who{font-size:21px;min-height:58px}
.cat{font-size:22px;min-height:90px}
.cat .ce{font-size:32px}
.cat .cn{font-size:15px}
.carth{font-size:16px}
.cline{padding:8px 0}
.cline .cp{font-size:19px}
.cline .qn{font-size:21px;min-width:52px}
.qb{min-width:50px;min-height:50px;font-size:24px}
.savebig{font-size:20px;min-height:62px}
.alt{justify-content:center}
.alt #textTog{flex:0 0 auto;border:0;background:none;text-decoration:underline;font-size:16px}
.prow{font-size:20px;min-height:62px}
.prow .badge{font-size:16px}
.sheethead h2{font-size:24px}
.sheetmsg{font-size:16px}
.slip h2{font-size:23px}
li{font-size:19px;padding:9px 0}
.q{font-size:20px}
.srow .have{font-size:24px}
.srow .nums{font-size:16px}
.ghead{font-size:20px}
.ghead .meta{font-size:15px}
.pc summary{font-size:16px}
.pc div{font-size:17px}
.empty{font-size:18px}
.settings h3{font-size:19px}
.short{font-size:14px}
.big{font-size:22px}
.bottom button{font-size:14px;min-height:64px}
.bottom .ico{font-size:28px}
.donebtn{font-size:17px}
.printbtn{width:100%;min-height:56px;margin-bottom:14px;font-size:18px}
#printArea{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff!important;color:#000!important;font:12pt/1.35 Inter,"Noto Sans Arabic",Arial,sans-serif}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea h1{font:800 20pt Archivo,Arial,sans-serif;margin:0 0 2pt}
  #printArea .pdate{margin:0 0 12pt;color:#333}
  #printArea .pcust{break-inside:avoid;page-break-inside:avoid;border:1.5pt solid #000;border-radius:6pt;padding:8pt 10pt;margin:0 0 10pt}
  #printArea h2{font:800 16pt Archivo,Arial,sans-serif;margin:0 0 4pt}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th{text-align:start;font-size:10pt;color:#333;border-bottom:1pt solid #000;padding:2pt 4pt}
  #printArea td{padding:4pt;border-bottom:.5pt solid #999;vertical-align:top}
  #printArea td.n{text-align:end;white-space:nowrap;font-weight:700;width:30%}
  #printArea td.box{width:18pt;font-size:14pt}
  #printArea tr.pg td{font-weight:800;background:#eee;border-bottom:1pt solid #000;padding-top:6pt}
  #printArea .ptot{break-before:page;page-break-before:always}
}
@media (prefers-reduced-motion:no-preference){.slip{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><div class="top"><h1 data-t="title">Orderboken</h1><button class="lang" id="setBtn" aria-label="⚙">⚙</button></div></header>
<main>
<section class="settings" id="settings" hidden></section>
<section class="feed" id="feed">
<input class="fld who" id="who" dir="auto" list="whoList" autocomplete="off" enterkeyhint="done"><datalist id="whoList"></datalist>
<div class="cats" id="cats"></div>
<div id="cart"></div>
<button class="pri savebig" id="cartSave">💾</button>
<div class="row alt"><button id="photoBtn">📷</button><button id="textTog">✍️</button></div>
<div id="textBox" hidden>
<div class="acts" style="margin-top:10px"><button class="big" id="micBtn" hidden>🎙</button></div>
<textarea id="inp" dir="auto" rows="2"></textarea>
<div class="row"><button class="pri" id="addBtn">OK</button></div>
</div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<div class="status" id="status" role="status"></div>
<div id="draft"></div>
<details class="calc" id="calc"><summary data-t="calcTitle">🧮</summary><textarea id="calcIn" dir="auto" rows="3"></textarea><div id="calcOut" aria-live="polite"></div></details>
</section>
<div id="view"></div>
</main>
<nav class="bottom" role="tablist">
<button role="tab" data-v="in"><span class="ico">🚚</span><span data-t="tInShort">Varor in</span></button>
<button role="tab" data-v="cust"><span class="ico">📦</span><span data-t="tCust">Kunder</span></button>
<button role="tab" data-v="tot"><span class="ico">🧮</span><span data-t="tTotShort">Totalt</span></button>
<button role="tab" data-v="stock"><span class="ico">📊</span><span data-t="tStock">Lager</span></button>
</nav>
<div id="printArea" aria-hidden="true"></div>
<div class="sheet" id="sheet" hidden><div class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
<div class="sheethead"><h2 id="sheetTitle"></h2><span class="sheetmsg" id="sheetMsg"></span><button id="sheetClose" data-t="done">Klar</button></div>
<div id="sheetBody"></div></div></div>

async function toCanvas(file,max){
  const url=URL.createObjectURL(file);const img=new Image();
  try{await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),0)}
  const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c;
}
async function shrink(file,max=1800){return(await toCanvas(file,max)).toDataURL("image/jpeg",0.85)}
// grey, high-contrast copy: much easier for text recognition on phone photos (shadows, grey paper)
async function prepOcr(file){
  const c=await toCanvas(file,2200),x=c.getContext("2d"),d=x.getImageData(0,0,c.width,c.height),a=d.data,h=new Uint32Array(256);
  for(let i=0;i<a.length;i+=4){const g=(a[i]*299+a[i+1]*587+a[i+2]*114)/1000|0;a[i]=g;h[g]++}
  const n=a.length/4;let lo=0,hi=255,acc=0;
  for(let v=0;v<256;v++){acc+=h[v];if(acc>n*.02){lo=v;break}}acc=0;
  for(let v=255;v>=0;v--){acc+=h[v];if(acc>n*.02){hi=v;break}}
  const k=255/Math.max(1,hi-lo);
  for(let i=0;i<a.length;i+=4){const g=Math.max(0,Math.min(255,(a[i]-lo)*k));a[i]=a[i+1]=a[i+2]=g}
  x.putImageData(d,0,0);return c.toDataURL("image/jpeg",0.92);
}
const loadScript=src=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function ocr(dataUrl){
  if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const w=await Tesseract.createWorker(({sv:"swe+eng",en:"eng+swe",pl:"pol+swe",da:"dan+swe",ar:"swe+eng"})[lang]);
  try{return(await w.recognize(dataUrl,{rotateAuto:true})).data.text}finally{await w.terminate()}
}
// one row of a delivery note. With units written ("10 krt 72 kg") the normal reader is used;
// a bare table row ("Kycklingfilé 10 72,00 59,90") is read as description, cartons, kg, (price…)
function ocrRow(line,kgFirst,inTable){
  const m=line.match(/^(.*?\p{L}[^\d]*?)\s+(\d.*)$/u);if(!m)return[];
  const pct=(m[2].match(/^\d+(?:\.\d+)?\s*%/)||[""])[0];
  const desc=(m[1]+" "+pct).replace(/[^\p{L}\p{N}\s%\-\/]/gu," ").replace(/\s+/g," ").trim(),tail=m[2].slice(pct.length).replace(/\d+(?:\.\d+)?\s*%/g," ");
  if(desc.replace(/[^\p{L}]/gu,"").length<3)return[];
  if(/(^|[\s\d])(kg|kilo|krt|kart|kolli|colli|ctn|kartong\w*|karton\w*|cartons?|st|stk|szt)(?=[\s.,]|$)/i.test(tail)){
    const o=parseLine("X: "+line);return o?o.items.filter(i=>i.product&&/\p{L}{2}/u.test(i.product)):[];
  }
  const toks=[...tail.matchAll(/\d+(?:\.\d+)?/g)].map(x=>x[0]);
  if(!toks.length||(!inTable&&toks.length<2&&!findProduct(desc)))return[];
  const ints=toks.filter(x=>!x.includes(".")),decs=toks.filter(x=>x.includes("."));
  let c=null,w=null;
  if(toks.length===1){if(decs.length)w=+toks[0];else c=+toks[0]}
  else if(decs.length&&ints.length){c=+ints[0];w=+decs[0]}
  else{[c,w]=kgFirst?[+toks[1],+toks[0]]:[+toks[0],+toks[1]]}
  const p=findProduct(desc.replace(/\d+(?:\.\d+)?\s*%/g,"")),base=p?{product:p[0],product_ar:p[1]}:{product:desc.toLowerCase().slice(0,40),product_ar:""};
  if(c>0&&w>0)return[{...base,qty:w,unit:"kg",cartons:c,perCarton:Math.round(w/c*1000)/1000}];
  if(w>0)return[{...base,qty:w,unit:"kg"}];
  return c>0?[{...base,qty:c,unit:"kartong",cartons:c}]:[];
}
// text read from a photo without AI: first company-looking line = supplier, product lines = items
function parseOcr(text){
  const lines=normalize(text).split(/\n+/).map(l=>l.replace(/[|_]+/g," ").replace(/\s+/g," ").replace(/^\d{4,}\s+/,"").trim()).filter(l=>l.length>1);
  if(!lines.length)return[];
  const sup=lines.find(l=>/\b(AB|A\/S|ApS|Ltd|GmbH|Oy|AS|Sp\. ?z ?o\.?o\.?|HB|KB)\b/i.test(l))||lines[0];
  const junk=/(kr\b|sek|dkk|pln|eur|moms|vat|total|summa|netto summa|att betala|org|tel|datum|date|faktura|invoice|adress|address|www|@)/i;
  const head=/^(kund|customer|kunde|klient|odbiorca|leverans|levering|dostaw|datum|date|data|följesedel|følgeseddel|delivery|dowód|art|summa|sum|total|razem|i alt|org|tel|nr\b)/i;
  // column header: is the kg column before the carton column?
  const cw=/(kolli|colli|krt|kart|antal|ilość|ilosc|ctn|cartons?|kartong|karton|pkt|pk)/i,kw=/(kg|vikt|netto|weight|waga|vægt|vaegt)/i;
  let hi=lines.findIndex(l=>cw.test(l)&&kw.test(l)&&!/\d{2,}/.test(l.replace(/kg/ig,"")));
  const kgFirst=hi>=0&&lines[hi].search(kw)<lines[hi].search(cw);
  let end=lines.findIndex((l,i)=>i>hi&&/^(summa|sum|total|razem|i alt|netto summa|att betala)/i.test(l));if(end<0)end=lines.length;
  const body=lines.slice(hi>=0?hi+1:0,end).filter(l=>l!==sup&&/\d/.test(l)&&!head.test(l)&&!junk.test(l.replace(/\d[\d.\s]*kg/ig,"")));
  const items=[];
  for(const l of body)for(const it of ocrRow(l,kgFirst,hi>=0))if(it.product&&!junk.test(it.product))items.push(it);
  return items.length?[{customer:sup.replace(/[^\p{L}\p{N} .&\/-]/gu,"").replace(/^[\s.\-]+|[\s.\-]+$/g,"").slice(0,40)||t("unknownSup"),items,note:""}]:[];
}

/* ---------- voice: the phone's own speech recognition ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,base="",finalText="";
function setupMic(){
  if(!SR)return;
  const b=$("#micBtn");b.hidden=false;
  b.onclick=()=>{
    if(listening){rec&&rec.stop();return}
    rec=new SR();rec.lang=({sv:"sv-SE",en:"en-GB",pl:"pl-PL",da:"da-DK",ar:"ar-SA"})[lang];rec.continuous=true;rec.interimResults=true;
    base=$("#inp").value.trim();finalText="";
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript+" ";else interim+=r[0].transcript}
      $("#inp").value=[base,(finalText+interim).trim()].filter(Boolean).join("\n")};
    rec.onstart=()=>{listening=true;b.classList.add("on");b.textContent=t("micOn")};
    rec.onend=()=>{const had=listening;listening=false;b.classList.remove("on");b.textContent=t("micShort");if(had&&finalText.trim())setTimeout(()=>$("#addBtn").click(),300)};
    rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){b.hidden=true}};
    try{rec.start()}catch(e){}
  };
}

      <select class="fld" data-mv="${i}" aria-label="${esc(p.name)}">${CATS.map(([k2,e2,l2])=>`<option value="${k2}"${k2===k?" selected":""}>${e2} ${t(l2)}</option>`).join("")}</select>
      <button class="small" data-pren="${i}" aria-label="${t("rename")}">✏️</button><button class="small del" data-pdel="${i}" aria-label="${t("remove")}">${armed==="p"+i?t("sure"):"✕"}</button></div>`).join("")}</div>`).join("")}
    <div class="row"><input class="fld" id="npName" dir="auto" placeholder="${t("prodName")}" style="flex:1 1 160px"><select class="fld" id="npCat">${CATS.map(([k,e,l])=>`<option value="${k}">${e} ${t(l)}</option>`).join("")}</select><button id="npAdd">${t("addProd")}</button></div></details>
    <h3>${t("sBackup")}</h3><p class="hint">${t("sBackupInfo")} <strong>${orders.length}</strong> ${t("sCount")}, <strong>${received.length}</strong> ${t("sCountIn")}.</p>
    <div class="row"><button id="expBtn">${t("sExport")}</button><button id="impBtn">${t("sImport")}</button><input type="file" id="impFile" accept=".json,application/json" hidden><span class="hint ok" id="impMsg"></span></div>
    <div class="row"><button id="closeSet">${t("sClose")}</button><span class="meta">Version ${APP_VERSION}</span></div>`;
  $("#langSel").onchange=e=>{lang=e.target.value;ls.set("ob_lang",lang);applyLang()};
  s.querySelectorAll("[data-mv]").forEach(x=>x.onchange=()=>{catalog[+x.dataset.mv].cat=x.value;saveCatalog();renderSettings();renderPick();render()});
  s.querySelectorAll("[data-pren]").forEach(b=>b.onclick=()=>{const p=catalog[+b.dataset.pren],nn=(prompt(t("renameProdQ"),p.name)||"").trim();if(!nn||nn===p.name)return;
    if(renameProduct(p.name,nn)){renderSettings();renderPick();render()}});
  s.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{const i=+b.dataset.pdel,id="p"+i;
    if(armed===id){armed=null;catalog.splice(i,1);saveCatalog();renderSettings();renderPick()}else{armed=id;renderSettings();setTimeout(()=>{if(armed===id){armed=null;renderSettings()}},4000)}
    const d=s.querySelector("details");if(d)d.open=true});
  $("#npAdd").onclick=()=>{const n=$("#npName").value.trim();if(!n||catProd(n))return;catalog.push({cat:$("#npCat").value,name:n});saveCatalog();renderSettings();renderPick();const d=s.querySelector("details");if(d)d.open=true};
  $("#keySave").onclick=()=>{const k=$("#keyIn").value.trim();if(k){ls.set("ob_key",k);renderSettings();render()}};
  const kd=$("#keyDel");if(kd)kd.onclick=()=>{ls.del("ob_key");renderSettings();render()};
  $("#expBtn").onclick=()=>{const blob=new Blob([JSON.stringify({app:"orderboken",v:3,orders,received,catalog},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="orderboken-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  $("#impBtn").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const list=Array.isArray(d)?d:d.orders;
    for(const o of list||[])if(o&&o.id&&Array.isArray(o.items)){const i=orders.findIndex(x=>x.id===o.id);i<0?orders.push(o):orders[i]=o}
    for(const r of (d&&d.received)||[])if(r&&r.id&&Array.isArray(r.items)){const i=received.findIndex(x=>x.id===r.id);i<0?received.push(r):received[i]=r}
    if(d&&Array.isArray(d.catalog))for(const c of d.catalog)if(c&&c.name&&!catProd(c.name))catalog.push(c);saveCatalog();
    persist();persistIn();render();renderPick();renderSettings();$("#impMsg").textContent=t("sImported")}catch(err){$("#impMsg").textContent="⚠ "+err.message}};
  $("#closeSet").onclick=()=>{s.hidden=true};
}
$("#setBtn").onclick=()=>{const s=$("#settings");s.hidden=!s.hidden;if(!s.hidden)renderSettings()};

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  applyMode();
  $("#calcIn").placeholder=t("calcPh");renderCalc();
  render();renderDraft();if(!$("#settings").hidden)renderSettings();
}
function calcLine(line){
  const x=normalize(line).trim();if(!x)return null;
  const nums=[...x.matchAll(/\d+(?:\.\d+)?/g)].map(m=>Number(m[0]));
  if(nums.length<2)return{text:line.trim(),bad:true};
  const n=nums[0],w=nums[1];
  const words=x.replace(/\d+(?:\.\d+)?/g," ").replace(UNIT_RE," ").trim();
  const pr=findProduct(words.split(/\s+/).filter(v=>!UNITALIAS.some(([a])=>a.toLowerCase()===v.toLowerCase())).join(" "));
  return{n,w,kg:Math.round(n*w*1000)/1000,prod:pr?pn(pr[0]):""};
}
function renderCalc(){
  const rows=$("#calcIn").value.split(/\n+/).map(calcLine).filter(Boolean);const ok=rows.filter(r=>!r.bad);
  const totKg=ok.reduce((a,r)=>a+r.kg,0),totN=ok.reduce((a,r)=>a+r.n,0);
  $("#calcOut").innerHTML=rows.map(r=>r.bad?`<div class="cl"><span dir="auto">${esc(r.text)}</span><span class="meta">?</span></div>`
    :`<div class="cl"><span dir="auto">${r.prod?esc(r.prod)+" · ":""}${fmt(r.n)} ${t("krt")} × ${fmt(r.w)} kg</span><strong>= ${fmt(r.kg)} kg</strong></div>`).join("")
    +(ok.length?`<div class="ctot"><span>${t("calcTotal")}${ok.length>1?` · ${fmt(totN)} ${t("krt")}`:""}</span><span>${fmt(totKg)} kg</span></div>`:"");
}
$("#calcIn").oninput=renderCalc;
function applyMode(){
  document.querySelectorAll("[role=tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.v===view));
  $("#feed").hidden=view==="stock"||view==="tot";
  $("#feed").classList.toggle("in",mode==="in");
  $("#calc").hidden=true;
  $("#photoBtn").hidden=view!=="in";
  $("#inp").placeholder=mode==="in"?t("phIn"):t("phOrder");
  $("#addBtn").textContent=t("read");
  $("#photoBtn").textContent=t("photoIn");
  $("#textTog").textContent=t("textTog");
  renderPick();
  if(!listening)$("#micBtn").textContent=t("micShort");
}

window.__ob={parseOffline,stockRows,parseOcr,matchCatalog,catOf,toCatalogItem,buildPrint};
load();
// renamed products: update a saved product list and earlier orders/deliveries once
(()=>{if(ls.get("ob_mig_names1",""))return;
  const ren={"Tajt":"Tigh","Leg quarter":"Lamm leg quarter"};
  for(const c of catalog)if(ren[c.name]&&!catProd(ren[c.name])){if(c.name==="Leg quarter")c.cat="lamm";c.name=ren[c.name]}
  const fix=list=>list.forEach(o=>(o.items||[]).forEach(it=>{if(ren[it.product])it.product=ren[it.product]}));
  fix(orders);fix(received);fix([carts.order,carts.in]);
  if(ls.get("ob_catalog",""))saveCatalog();persist();persistIn();saveCarts();ls.set("ob_mig_names1","1")})();
setupMic();applyLang();
if("serviceWorker" in navigator&&location.protocol==="https:"){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update()})}).catch(()=>{});
}
}
</script>
