<style>
/* Standalone Orderboken: no claude.ai needed. Data lives on this phone (localStorage).
   Optional: your own Claude API key for smarter reading + "ask" tab. */
:root{color-scheme:light dark;
--bg:light-dark(#fbf8f4,#171112);--paper:light-dark(#ffffff,#221a1b);--ink:light-dark(#1d1414,#f3ecea);
--mute:light-dark(#6f6262,#b4a6a4);--red:light-dark(#a3162b,#e2465c);--redbg:light-dark(#f8e4e6,#3a1e22);
--line:light-dark(#eadfda,#3a2f30);--ok:light-dark(#2f6b3a,#7fcf8c)}
*{box-sizing:border-box;min-width:0}
textarea,input,select{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Noto Sans Arabic",system-ui,sans-serif;overflow-x:clip}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] textarea{font-family:"Noto Sans Arabic",Inter,system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px) 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1240px;margin:auto}
.hbtns{display:flex;gap:8px;flex:none}
h1{font:800 clamp(28px,6vw,40px)/1.05 Archivo,"Noto Sans Arabic",sans-serif;margin:0}
.sub{opacity:.85;font-size:14px;margin:4px 0 0}
.lang{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;min-height:44px;padding:0 16px;font:600 15px Inter,"Noto Sans Arabic";cursor:pointer}
main{max-width:1240px;margin:auto;padding:0 max(5vw,16px) 48px}
.feed{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:-12px;box-shadow:0 8px 24px rgba(60,10,20,.08)}
textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 45%,transparent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 16px;font:600 15px Inter,"Noto Sans Arabic",sans-serif;cursor:pointer}
.pri{background:var(--red);border-color:var(--red);color:#fff;flex:1 1 160px}
.big{display:block;width:100%;min-height:96px;font:800 24px Archivo,"Noto Sans Arabic",sans-serif;border-radius:16px;margin-bottom:10px;background:var(--red);border-color:var(--red);color:#fff}
.big.on{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.hint{color:var(--mute);font-size:13px;margin:8px 2px 0}
.status{font-size:14px;color:var(--red);min-height:20px;margin:6px 2px 0}
.draft{border:2px dashed var(--red);border-radius:14px;padding:12px;margin-top:12px;background:var(--redbg)}
.draft h3{margin:0 0 6px;font:700 16px Archivo,"Noto Sans Arabic"}
.draft .dord{background:var(--paper);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.fld{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:40px;padding:0 8px;font-size:16px}
.nm{width:100%;font-weight:700}
.irow{display:grid;grid-template-columns:1fr 76px 84px 40px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.irow:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;margin:22px 0 14px;overflow-x:auto}
.tabs button{flex:none;border-radius:999px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--paper);color:var(--ink);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.slip{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;padding:14px 14px 10px}
.slip header{all:unset;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.slip h2{font:800 20px/1.15 Archivo,"Noto Sans Arabic",sans-serif;margin:0 0 2px}
.meta{color:var(--mute);font-size:13px}
ul{list-style:none;margin:10px 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.q{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ar{color:var(--mute);font-size:13px}
.order{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.order.done{opacity:.55}
.order .raw{font-size:13px;color:var(--mute);font-style:italic}
.small{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.del{color:var(--red)}
.tot li{font-size:17px}
.tot .q{color:var(--red)}
.empty{color:var(--mute);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.answer{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;margin-top:12px}
.flag{background:#fff3cd;color:#5a4300;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
.settings{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.settings h3{margin:14px 0 4px;font:700 16px Archivo,"Noto Sans Arabic"}
.settings h3:first-child{margin-top:0}
.settings input[type=password]{width:100%}
.ok{color:var(--ok);font-weight:600}
.crow{display:flex;gap:6px;align-items:center;padding:0 0 6px;font-size:13px;color:var(--mute)}
.crow .fld{width:76px;min-height:36px}
.srow .have{text-align:end}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mode button{border-radius:12px}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed.in{border-top:5px solid var(--ok)}
.feed.in .big,.feed.in .pri{background:var(--ok);border-color:var(--ok)}
.draft.in{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.slip.inl{border-top-color:var(--ok)}
.srow{padding:10px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .top1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.srow .have{font:800 22px/1.1 Archivo,"Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .nums{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:4px;font-size:13px;color:var(--mute)}
.srow .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.neg,.srow .nums b.neg{color:var(--red)}
.short{background:var(--redbg);color:var(--red);border-radius:999px;padding:1px 8px;font-weight:700;font-size:12px}
@media (prefers-reduced-motion:no-preference){.slip{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

</nav>
<div id="view"></div>
</main>

function cartonize(it,per){

function parseItem(raw){
  let s=raw.trim().replace(/^(och|samt|plus)\s+/i,"").replace(/[.!?؟]+$/,"").replace(/\s+(och|samt|plus|و)$/i,"").trim();
  if(/^و/.test(s)&&startsItem(s.slice(1).trim()))s=s.slice(1).trim();
  if(!s)return null;
  let qty=null,unit=null,m,per=null;
  if((m=s.match(/\s*@(\d+(?:\.\d+)?)\s*$/))){per=toNum(m[1]);s=s.slice(0,m.index).trim()}
  if((m=s.match(/^(\d+(?:[.,]\d+)?)\s*/))){qty=toNum(m[1]);s=s.slice(m[0].length)}
  else if((m=s.match(NUM_RE))){qty=NUMWORDS.find(([w])=>w.toLowerCase()===m[1].toLowerCase())[1];s=s.slice(m[0].length).trim()}
  if((m=s.match(UNIT_RE))){const a=m[1].toLowerCase();unit=UNITALIAS.find(([x])=>x.toLowerCase()===a)[1];if(a==="كيلوين"&&qty===null)qty=2;s=s.slice(m[0].length).trim();if(qty===null)qty=1}

  if(!unit){const w=s.split(/\s+/);const u=w.length>1&&UNITALIAS.find(([x])=>x.toLowerCase()===w[w.length-1].toLowerCase());if(u){unit=u[1];s=w.slice(0,-1).join(" ")}}

  if(!s&&unit!=="kartong"){if(!hadQty)return null;if(unit==="g"){qty/=1000;unit="kg"}return{product:"",qty,unit,_qtyOnly:true}}
  const p=s?findProduct(s):null;
  if(qty===null)qty=1;
  if(!unit)unit=p?p[2]:"st";
  if(unit==="g"){qty=qty/1000;unit="kg"}

}
const CARTON_RE=/(\d+(?:\.\d+)?)\s*(?:kartonger|kartongen|kartonge|kartong|krt|kart|kolli|كراتين|كرتونات|كرتونة|كرتون)\s*([^\d,;@\n]*?)\s*(?:à|á|a|@|per|om|x|×|kg\/st|كل واحدة|كل واحد|كل|بوزن|وزن)?\s*(\d+(?:\.\d+)?)(?:\s*(?:kg|kilo|kilon|كيلو))?(?=\s*(?:$|[,;.]|och\s|samt\s|و|\n))/gi;
function parseLine(line){
  line=line.trim();if(!line)return null;
  let name="",rest="",m;
  if((m=line.match(/^([^:：\d]{1,40})[:：](.+)$/))){name=m[1];rest=m[2]}
  else{
    const tok=line.split(/\s+/);let i=0;
    for(;i<tok.length;i++){if(startsItem(tok.slice(i).join(" ")))break}
    name=tok.slice(0,i).join(" ");rest=tok.slice(i).join(" ");
  }
  name=name.split(/\s+/).filter(w=>w&&!FILLER.has(w.toLowerCase().replace(/[,.]/g,""))).join(" ").replace(/[,.:\-–]+$/,"").trim()||"Okänd";
  rest=rest.replace(CARTON_RE,(m0,n,prod,w)=>`${n} kartong ${prod.trim()} @${w}`)
           .replace(/([^\d\s,.@])\s+(?=\d)/g,"$1,")
           .replace(/\s+و\s*(?=\d|كيلو|نص|نصف|ربع|علب|صندوق|كرتون|حب)/g,",")
           .replace(/\s+و(?=\S)/g,(x,off,str)=>startsItem(str.slice(off+x.length))?",":x);
  const items=[];
  for(const it of rest.split(/\s*,\s*|\s+och\s+|\s+samt\s+|\s+plus\s+|;|\s+و\s+/i).map(parseItem).filter(Boolean)){
    const prev=items[items.length-1];
    if(it._qtyOnly){
      if(prev&&prev.unit==="kartong"&&!prev.perCarton&&(!it.unit||it.unit==="kg"))items[items.length-1]=cartonize(prev,it.qty); // "70 kartonger, 7.2"
      else if(prev&&!prev._q){prev.qty=it.qty;prev.unit=it.unit;prev._q=true}
      continue}
    items.push(it);
  }
  items.forEach(i=>delete i._q);

  return items.length?{customer:name,items,note:""}:null;
}
function parseOffline(text){return normalize(text).split(/\n+/).map(parseLine).filter(Boolean)}

const getKey=()=>ls.get("ob_key","");
async function claude(prompt,maxTokens){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":getKey(),"anthropic-version":"2026-10-21",
    "anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-opus-5-5",max_tokens:maxTokens,output_config:{effort:"low"},fallbacks:"default",messages:[{role:"user",content:prompt}]})});
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j)throw new Error((j&&j.error&&j.error.message)||("HTTP "+r.status));

"""${text}"""`,4000);

    const totLi=i=>{const r=sm.get(i.product+"|"+i.unit);const hasStock=r&&r.in!==0;
      return `<li><span dir="auto">${esc(i.product)} <span class="ar">${esc(i.product_ar)}</span>${hasStock?`<br><span class="meta">${fmt(r.have)} ${esc(i.unit)} ${t("stHave")}</span>${r.left<0?` <span class="short">${t("stShort")} ${fmt(-r.left)} ${esc(i.unit)}</span>`:""}`:""}</span><span class="q">${fmt(i.qty)} ${esc(i.unit)}</span></li>`};
    v.innerHTML=searchBox+(s.length?`<div class="slip tot"><ul>${s.map(totLi).join("")}</ul>
      <div class="row"><button id="copyBtn">${t("copy")}</button><span class="meta">${new Set(list.map(o=>o.customer)).size} ${t("tCust").toLowerCase()} · ${list.length} ${t("orders")}</span></div></div>`:`<div class="empty">${t("empty")}</div>`);
    const cb=$("#copyBtn");if(cb)cb.onclick=()=>shareText(s.map(i=>`${i.product}${i.product_ar?" ("+i.product_ar+")":""}: ${fmt(i.qty)} ${i.unit}`).join("\n"),cb);
  }else{
    const by=new Map();for(const o of list){if(!by.has(o.customer))by.set(o.customer,[]);by.get(o.customer).push(o)}
    v.innerHTML=searchBox+(by.size?`<div class="grid">${[...by].map(([c,os])=>`<article class="slip"><header><div><h2 dir="auto">${esc(c)}</h2>
      <div class="meta">${os.length} ${t("orders")}</div></div><button class="small" data-ren="${esc(c)}" aria-label="${t("rename")}">✏️</button></header>
      <ul>${sumItems(os).map(itemLi).join("")}</ul>
      <div>${os.map(o=>`<div class="order${o.done?" done":""}"><div class="meta">${when(o.created)}${o.note?` · <span dir="auto">${esc(o.note)}</span>`:""}</div>
        <div class="raw" dir="auto">"${esc(o.raw.length>90?o.raw.slice(0,90)+"…":o.raw)}"</div>
        <div class="row"><button class="small" data-done="${o.id}">${o.done?t("undo"):"✓ "+t("delivered")}</button><button class="small del" data-del="${o.id}">${armed===o.id?t("sure"):t("remove")}</button></div></div>`).join("")}</div></article>`).join("")}</div>`
      :`<div class="empty">${showDone?t("emptyDone"):t("empty")}</div>`);
    v.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const o=orders.find(x=>x.id===b.dataset.done);if(o)put({...o,done:!o.done})});
    v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(armed===id){armed=null;drop(id)}else{armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},4000)}});
    v.querySelectorAll("[data-ren]").forEach(b=>b.onclick=()=>{const old=b.dataset.ren;const nn=(prompt(t("renameQ"),old)||"").trim();if(!nn||nn===old)return;
      orders=orders.map(o=>o.customer===old?{...o,customer:nn}:o);persist();render()});
  }
  const qi=$("#q");if(qi)qi.oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
}
function renderStockViews(v){
  const searchBox=`<input class="search" id="q" dir="auto" placeholder="${t("search")}" value="${esc(q)}">`;
  const ql=q.toLowerCase();
  if(view==="stock"){
    const rows=stockRows().filter(r=>r.in!==0||r.out!==0).filter(r=>!q||(r.product+" "+r.product_ar).toLowerCase().includes(ql));
    const short=rows.filter(r=>r.left<0).length;
    v.innerHTML=searchBox+(rows.length?`<div class="slip tot"><p class="hint" style="margin-top:0">${t("stockInfo")}</p>${rows.map(r=>`<div class="srow">
      <div class="top1"><span dir="auto"><strong>${esc(r.product)}</strong> <span class="ar">${esc(r.product_ar)}</span></span><span class="have${r.have<0?" neg":""}">${fmt(r.have)} ${esc(unitTxt(r.unit))}${r.per?`<br><span class="meta" style="font:13px Inter,'Noto Sans Arabic'">≈ ${fmt(r.have/r.per)} ${t("krt")} (${fmt(r.per)} kg)</span>`:""}</span></div>
      <div class="nums"><span>${t("stIn")} <b>${fmt(r.in)}</b></span><span>${t("stOut")} <b>${fmt(r.out)}</b></span><span>${t("stOpen")} <b>${fmt(r.open)}</b></span>
        <span>${t("stLeft")} <b class="${r.left<0?"neg":""}">${fmt(r.left)}</b></span>${r.left<0?`<span class="short">${t("stShort")} ${fmt(-r.left)} ${esc(r.unit)}</span>`:""}
        <button class="small" style="margin-inline-start:auto" data-adj="${esc(r.product)}|${esc(r.unit)}">${t("adjust")}</button></div></div>`).join("")}
      <div class="row"><button id="copyBtn">${t("copyStock")}</button>${short?`<span class="short">${short} × ${t("stShort")}</span>`:""}</div></div>`
      :`<div class="empty">${t("emptyStock")}</div>`);
    v.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{const[prod,unit]=b.dataset.adj.split("|");const r=stockRows().find(x=>x.product===prod&&x.unit===unit);if(!r)return;
      const ans=prompt(t("adjustQ").replace("{p}",prod).replace("{u}",unit),String(Math.round(r.have*100)/100));if(ans===null)return;
      const n=Number(String(normalize(ans)).replace(",","."));if(!isFinite(n))return;const diff=Math.round((n-r.have)*1000)/1000;if(!diff)return;
      const now=Date.now();putIn({id:"a"+now,supplier:t("adjName"),adjust:true,items:[{product:prod,product_ar:r.product_ar||"",qty:diff,unit}],note:"",raw:`${prod}: ${fmt(r.have)} → ${fmt(n)} ${unit}`,created:now})});
    const cb=$("#copyBtn");if(cb)cb.onclick=()=>shareText(t("stockTitle")+" "+new Date().toLocaleDateString(lang==="ar"?"ar":"sv-SE")+"\n"+rows.map(r=>`${r.product}${r.product_ar?" ("+r.product_ar+")":""}: ${fmt(r.have)} ${r.unit}`).join("\n"),cb);
  }else{
    const list=received.filter(r=>!q||(r.supplier+" "+r.items.map(i=>i.product+" "+i.product_ar).join(" ")+" "+r.note).toLowerCase().includes(ql)).sort((a,b)=>b.created-a.created);
    const tot=sumItems(list.filter(r=>!r.adjust));
    v.innerHTML=searchBox+(list.length?`${tot.length?`<div class="slip inl tot" style="margin-bottom:14px"><div class="meta">${t("received")} · ${list.filter(r=>!r.adjust).length} ${t("tIn").toLowerCase()} · ${new Set(list.filter(r=>!r.adjust).map(r=>r.supplier)).size} ${t("suppliers")}</div><ul>${tot.map(itemLi).join("")}</ul></div>`:""}
      <div class="grid">${list.map(r=>`<article class="slip inl"><h2 dir="auto">${r.adjust?"⚖️ ":"🚚 "}${esc(r.supplier)}</h2><div class="meta">${when(r.created)}${r.note?` · <span dir="auto">${esc(r.note)}</span>`:""}</div>
      <ul>${r.items.map(itemLi).join("")}</ul><div class="raw" dir="auto" style="font-size:13px;color:var(--mute);font-style:italic">"${esc(r.raw.length>90?r.raw.slice(0,90)+"…":r.raw)}"</div>
      <div class="row"><button class="small del" data-deli="${r.id}">${armed===r.id?t("sure"):t("remove")}</button></div></article>`).join("")}</div>`
      :`<div class="empty">${t("emptyIn")}</div>`);
    v.querySelectorAll("[data-deli]").forEach(b=>b.onclick=()=>{const id=b.dataset.deli;if(armed===id){armed=null;dropIn(id)}else{armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},4000)}});
  }
  const qi=$("#q");if(qi)qi.oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
}
let lastAnswer="";
function renderAsk(v){
  v.innerHTML=`<div class="feed" style="margin-top:0"><textarea id="askIn" dir="auto" placeholder="${t("askPh")}"></textarea>
    <div class="row"><button class="pri" id="askBtn">${t("askBtn")}</button></div></div><div class="answer" id="ans" dir="auto" ${lastAnswer?"":"hidden"}>${esc(lastAnswer)}</div>`;
  $("#askBtn").onclick=async()=>{
    const qq=$("#askIn").value.trim();if(!qq)return;const a=$("#ans");a.hidden=false;
    if(!getKey()){a.textContent=t("noKey");return}
    a.textContent=t("thinking");$("#askBtn").disabled=true;
    const data=orders.map(o=>({customer:o.customer,items:o.items.map(i=>`${i.qty} ${i.unit} ${i.product}`),note:o.note,delivered:o.done,date:new Date(o.created).toISOString().slice(0,16)}));
    const inData=received.map(r=>({supplier:r.supplier,adjustment:!!r.adjust,items:r.items.map(i=>`${i.qty} ${i.unit} ${i.product}`),date:new Date(r.created).toISOString().slice(0,16)}));
    const stock=stockRows().map(r=>({product:r.product,unit:r.unit,received:r.in,delivered_to_customers:r.out,in_stock:r.have,open_orders:r.open,left_after_open_orders:r.left}));
    try{lastAnswer=await claude(`You are the order and stock assistant for a meat wholesaler: big deliveries come IN from suppliers, and goods go OUT to customers. Answer the question using ONLY the data below. Reply in the same language as the question (Swedish or Arabic). Be short and exact; add up quantities carefully and show totals with units. Plain text, no markdown. Today is ${new Date().toISOString().slice(0,10)}.
CUSTOMER ORDERS: ${JSON.stringify(data)}
DELIVERIES RECEIVED FROM SUPPLIERS: ${JSON.stringify(inData)}
CURRENT STOCK (computed): ${JSON.stringify(stock)}
QUESTION: ${qq}`,4000);a.textContent=lastAnswer}
    catch(e){a.textContent="⚠ "+e.message}
    finally{$("#askBtn").disabled=false}
  };
}

/* ---------- voice: the phone's own speech recognition ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,base="",finalText="";
function setupMic(){
  if(!SR)return;
  const b=$("#micBtn");b.hidden=false;
  b.onclick=()=>{
    if(listening){rec&&rec.stop();return}
    rec=new SR();rec.lang=lang==="ar"?"ar-SA":"sv-SE";rec.continuous=true;rec.interimResults=true;
    base=$("#inp").value.trim();finalText="";
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript+" ";else interim+=r[0].transcript}
      $("#inp").value=[base,(finalText+interim).trim()].filter(Boolean).join("\n")};
    rec.onstart=()=>{listening=true;b.classList.add("on");b.textContent=t("micOn")};
    rec.onend=()=>{const had=listening;listening=false;b.classList.remove("on");b.textContent=t("mic");if(had&&finalText.trim())setTimeout(()=>$("#addBtn").click(),300)};
    rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){b.hidden=true}};
    try{rec.start()}catch(e){}
  };
}

/* ---------- settings: API key + backup ---------- */
function renderSettings(){
  const s=$("#settings");const has=!!getKey();
  s.innerHTML=`<h3>${t("sKey")}</h3><p class="hint">${t("sKeyInfo")}</p>
    <div class="row"><input class="fld" type="password" id="keyIn" placeholder="sk-ant-…" autocomplete="off" style="flex:1 1 220px"><button id="keySave">${t("sKeySave")}</button>${has?`<button class="del" id="keyDel">${t("sKeyDel")}</button>`:""}</div>
    <p class="hint ${has?"ok":""}">${has?t("sKeyOn"):t("sKeyOff")}</p>
    <h3>${t("sBackup")}</h3><p class="hint">${t("sBackupInfo")} <strong>${orders.length}</strong> ${t("sCount")}, <strong>${received.length}</strong> ${t("sCountIn")}.</p>
    <div class="row"><button id="expBtn">${t("sExport")}</button><button id="impBtn">${t("sImport")}</button><input type="file" id="impFile" accept=".json,application/json" hidden><span class="hint ok" id="impMsg"></span></div>
    <div class="row"><button id="closeSet">${t("sClose")}</button><span class="meta">Version ${APP_VERSION}</span></div>`;
  $("#keySave").onclick=()=>{const k=$("#keyIn").value.trim();if(k){ls.set("ob_key",k);renderSettings()}};
  const kd=$("#keyDel");if(kd)kd.onclick=()=>{ls.del("ob_key");renderSettings()};
  $("#expBtn").onclick=()=>{const blob=new Blob([JSON.stringify({app:"orderboken",v:2,orders,received},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="orderboken-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  $("#impBtn").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const list=Array.isArray(d)?d:d.orders;
    for(const o of list||[])if(o&&o.id&&Array.isArray(o.items)){const i=orders.findIndex(x=>x.id===o.id);i<0?orders.push(o):orders[i]=o}
    for(const r of (d&&d.received)||[])if(r&&r.id&&Array.isArray(r.items)){const i=received.findIndex(x=>x.id===r.id);i<0?received.push(r):received[i]=r}
    persist();persistIn();render();renderSettings();$("#impMsg").textContent=t("sImported")}catch(err){$("#impMsg").textContent="⚠ "+err.message}};
  $("#closeSet").onclick=()=>{s.hidden=true};
}
$("#setBtn").onclick=()=>{const s=$("#settings");s.hidden=!s.hidden;if(!s.hidden)renderSettings()};

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#langBtn").textContent=lang==="ar"?"Svenska":"عربي";
  applyMode();
  if(!listening)$("#micBtn").textContent=t("mic");
  render();renderDraft();if(!$("#settings").hidden)renderSettings();
}
function applyMode(){
  document.querySelectorAll(".mode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===mode));
  $("#feed").classList.toggle("in",mode==="in");
  $("#hint").textContent=mode==="in"?t("hintIn"):t("hint");
  $("#inp").placeholder=mode==="in"?t("phIn"):(lang==="ar"?"أحمد: ٥ كيلو لحم، ٥ كيلو دجاج":"Ahmed: 5 kg kött, 5 kg kyckling, 2 lådor tomater");
  $("#addBtn").textContent=mode==="in"?"🚚 "+t("add"):t("add");
}
document.querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{mode=b.dataset.k;if(draft&&draft.kind!==mode){draft=null;renderDraft()}applyMode()});
$("#langBtn").onclick=()=>{lang=lang==="sv"?"ar":"sv";ls.set("ob_lang",lang);applyLang()};

window.__ob={parseOffline,stockRows};
load();setupMic();applyLang();
if("serviceWorker" in navigator&&location.protocol==="https:"){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update()})}).catch(()=>{});
}
}
